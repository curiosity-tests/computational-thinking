name: Keep caches fresh
run-name: "Keep caches fresh ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"
on:
    schedule:
        - cron: "5 4 1/4 * *" # every 4 days
    workflow_dispatch:
        inputs:
            leg:
                description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
                type: choice
                options: [instrumented, baseline]
                default: baseline
            profile:
                description: "CrashOverride chalk profile"
                type: string
                default: curiosity-tests-racecar
            racecar_run:
                description: "racecar correlation token, echoed into the run name"
                type: string
                default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
concurrency:
    group: export
    cancel-in-progress: false

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Fall 24 source
              uses: actions/checkout@v6

            - name: ⏱ Cache notebook states
              uses: actions/cache@v4
              with:
                path: _cache
                key: ${{ runner.os }}-pluto_state_cache-v3-${{ hashFiles('**/Project.toml', '**/Manifest.toml') }}-${{ github.run_id }}
                restore-keys: |
                    ${{ runner.os }}-pluto_state_cache-v3-${{ hashFiles('**/Project.toml', '**/Manifest.toml') }}

            - name: ⏱ Cache .julia
              uses: actions/cache@v4
              with:
                path: ~/.julia
                key: ${{ runner.os }}-dotjulia-v1-${{ hashFiles('**/Project.toml', '**/Manifest.toml') }}-${{ github.run_id }}
                restore-keys: |
                    ${{ runner.os }}-dotjulia-v1-${{ hashFiles('**/Project.toml', '**/Manifest.toml') }}
